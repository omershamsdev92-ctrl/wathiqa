<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم | وثيقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .doc-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            overflow-y: auto;
            padding: 2rem;
            z-index: 200;
        }

        .editor-content {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
        }

        .code-area {
            width: 100%;
            font-family: monospace;
            min-height: 150px;
            background: #f4f4f4;
            border: 1px solid #ccc;
            padding: 0.5rem;
            direction: ltr;
        }
    </style>
</head>

<body>
    <!-- Login Section -->
    <div id="login-section" class="login-box">
        <h2>تسجيل الدخول</h2>
        <p style="margin-bottom: 1rem; color: #666;">لوحة التحكم للمشرفين فقط</p>
        <input type="password" id="admin-pass" class="form-input" placeholder="كلمة المرور"
            style="margin-bottom: 1rem;">
        <button id="login-btn" class="btn btn-primary" style="width: 100%;">دخول</button>
        <p id="login-error" style="color: red; margin-top: 0.5rem; display: none;">كلمة المرور غير صحيحة</p>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="admin-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>إدارة الوثائق</h1>
            <div>
                <button id="add-new-btn" class="btn btn-primary">إضافة وثيقة جديدة +</button>
                <button id="logout-btn" class="btn btn-outline">خروج</button>
            </div>
        </div>

        <div id="docs-list">
            <!-- List Items -->
        </div>

        <div style="margin-top: 3rem; border-top: 1px solid #ccc; padding-top: 1rem;">
            <h3>إجراءات خطيرة</h3>
            <button id="reset-defaults-btn" class="btn btn-outline" style="color: red; border-color: red;">إعادة ضبط
                المصنع (مسح كل التعديلات)</button>
        </div>
    </div>

    <!-- Editor Modal -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-content">
            <h2 id="editor-title" style="margin-bottom: 1rem;">تحرير وثيقة</h2>
            <form id="editor-form">
                <div class="form-group">
                    <label>المعرف (ID)</label>
                    <input type="text" id="edit-id" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>عنوان الوثيقة</label>
                    <input type="text" id="edit-title" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>الأيقونة (Emoji)</label>
                    <input type="text" id="edit-icon" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>الحقول (JSON Fields)</label>
                    <p style="font-size: 0.8rem; color: #666;">Format: [{"name": "x", "label": "X", "type": "text"}]</p>
                    <textarea id="edit-fields" class="code-area"></textarea>
                </div>

                <div class="form-group">
                    <label>قالب HTML (Template)</label>
                    <p style="font-size: 0.8rem; color: #666;">Use placeholders like {{name}}</p>
                    <textarea id="edit-template" class="code-area" style="min-height: 300px;"></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                    <button type="button" id="cancel-edit" class="btn btn-outline">إلغاء</button>
                    <button type="button" id="delete-doc-btn" class="btn btn-outline"
                        style="color: red; border-color: red; margin-right: auto;">حذف الوثيقة</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./src/admin.js"></script>
</body>

</html>
